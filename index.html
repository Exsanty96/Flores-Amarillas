<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071d3a">
<title>Un ramo para ti 🌻</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="loading" id="loading"><b>🌻</b><span>Preparando algo especial...</span></div>

<main>
<canvas id="painting"></canvas>

<section class="intro" id="intro">
  <div class="line"></div>
  <small>PORQUE TODA AMIGA MERECE UNAS FLORES AMARILLAS</small>
  <h1>Hay personas que<br><em>hacen la vida más bonita...</em></h1>
  <div class="heart">♥</div>
  <button id="start">🎨 Comenzar a pintar</button>
</section>

<div class="label" id="label">Pintando un girasol...</div>

<section class="final" id="final">
  <article>
    <div class="sunflower">🌻</div>
    <small>PARA UNA AMIGA</small>
    <h2>Gracias por estar,<br>por tu amistad,<br>por hacer la vida<br><em>más especial.</em></h2>
    <div class="divider">✦ ✦ ✦</div>
    <p>TE DEJO UNAS FLORES AMARILLAS, PORQUE SÍ</p>
    <b>♥</b>
  </article>
</section>

<button class="replay" id="replay">↻</button>
</main>
<script src="script.js"></script>
</body>
</html>
